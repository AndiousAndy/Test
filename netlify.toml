[build]
  # Use standard npm run build, remove NEXT_STATIC_BUILD
  command = "NODE_ENV=production npm run build"
  # Publish the standard Next.js output directory
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  # Set a placeholder DATABASE_URL for Prisma to build without connecting
  DATABASE_URL = "file:./dev.db"
