[build]
  # More explicit build command to avoid Prisma issues
  command = "NODE_ENV=production NEXT_STATIC_BUILD=true npm run build"
  publish = "out"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  # Set a placeholder DATABASE_URL for Prisma to build without connecting
  DATABASE_URL = "file:./dev.db"
